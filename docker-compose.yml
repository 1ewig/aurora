name: aurora

services:
  web:
    container_name: aurora-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_INSFORGE_URL: ${NEXT_PUBLIC_INSFORGE_URL}
        NEXT_PUBLIC_INSFORGE_ANON_KEY: ${NEXT_PUBLIC_INSFORGE_ANON_KEY}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
        NEXT_PUBLIC_LS_ORDER_VARIANT_ID: ${NEXT_PUBLIC_LS_ORDER_VARIANT_ID}
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    restart: unless-stopped
